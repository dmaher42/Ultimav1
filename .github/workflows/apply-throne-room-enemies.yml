name: Apply throne-room enemy NPCs

on:
  push:
    branches:
      - feature/throne-room-enemy-npcs-v2
    paths:
      - tools/apply_throne_room_enemy_integration.py
      - .github/workflows/apply-throne-room-enemies.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout enemy NPC branch
        uses: actions/checkout@v5
        with:
          ref: feature/throne-room-enemy-npcs-v2
          fetch-depth: 0

      - name: Apply enemy NPC integration
        run: |
          python tools/apply_throne_room_enemy_integration.py
          sed -i 's|require(public_index, "./game.js?v=22"|require(public_index, "game.js?v=22"|' verification/verify_throne_room_enemies.py

      - name: Verify throne-room enemies
        run: python verification/verify_throne_room_enemies.py

      - name: Commit verified enemy NPC integration
        shell: bash
        run: |
          rm -f tools/apply_throne_room_enemy_integration.py
          rm -f .github/workflows/apply-throne-room-enemies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add visible enemy NPCs to the throne room"
          git push origin HEAD:feature/throne-room-enemy-npcs-v2
